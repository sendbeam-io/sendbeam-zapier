name: Bug report
description: A SendBeam trigger, action or search in Zapier does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Most reports turn out to depend on which trigger or action is involved, the
        permissions on the API key, or what the Zap's history says, so the fields below are what let us
        reproduce it rather than guess at it.

        **Never paste an API key.** If it is exploitable, please do not open an issue — see
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The shortest path from a new Zap to the problem.
      placeholder: |
        1. Trigger: SendBeam → Contact Added to List, list "Newsletter"
        2. Action: …
        3. …
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - A trigger
        - An action
        - A search
        - Connecting the SendBeam account
        - A dropdown (lists, tags, forms, campaigns…)
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Trigger, action or search
      placeholder: "Add Tag to Contact"
    validations:
      required: true
  - type: input
    id: permissions
    attributes:
      label: Permissions on the API key
      placeholder: "contacts:read, contacts:write, tags:write — Settings → API keys in SendBeam"
  - type: textarea
    id: errors
    attributes:
      label: The error, if there is one
      description: >
        The message from the Zap's history (Zap runs → the failed run → the SendBeam step). Paste the text rather
        than a screenshot where you can, and remove anything private first.
      render: text
